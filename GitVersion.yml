# The version comes from the git history (GitVersion): a release branch release/<x.y> is <x.y>.0 (AGENTS.md).
# Until the first stable release a merge to main is 0.1.0-beta.<commits since the last tag>, and the GitHub release
# is marked as a pre-release. `+semver: minor` or `+semver: major` in a commit message bumps that part.
#
# To release a stable version: delete the `label` line (and set next-version to 1.0.0).
mode: ContinuousDelivery
next-version: 0.1.0
branches:
  main:
    label: beta

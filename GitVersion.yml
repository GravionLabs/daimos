# The version comes from the git history (GitVersion): a merge to main is a release.
# From 0.3 on the versions are stable. Without a label ContinuousDeployment gives plain
# <major>.<minor>.<patch>, and the GitHub release is not marked as a pre-release.
#
# Releases are numbered from the last stable tag: a merge is the next patch, `+semver: minor` or
# `+semver: major` in a commit message bumps that part.
mode: ContinuousDeployment

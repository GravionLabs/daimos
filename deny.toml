# cargo-deny: licenses and advisories (`cargo deny check`), run on every pull request.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # proc-macro-error is a build-time dependency of the GTK 3 bindings that Tauri uses on Linux; there is no
  # fix until Tauri moves to GTK 4. Revisit when it does.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, pulled in by gtk3-macros through Tauri" },
  # The GTK 3 layer-shell bindings are archived; the GTK 4 ones cannot be used because Tauri's webview
  # is GTK 3. Same exit as the other GTK 3 crates: when Tauri moves to GTK 4.
  { id = "RUSTSEC-2024-0422", reason = "no GTK 3 alternative while Tauri uses GTK 3" },
  { id = "RUSTSEC-2024-0423", reason = "same crate family (gtk-layer-shell-sys)" },
  # paste is a proc macro used by specta; it only runs at compile time and has no replacement there.
  { id = "RUSTSEC-2024-0436", reason = "compile-time proc macro of specta, no runtime code" },
  # zbus, zvariant and zvariant_derive moved into zbus 6; zbus_names, zvariant and zvariant_derive 5.x are
  # flagged as unmaintained. zbus 5 is pulled in by ashpd and tauri-plugin-single-instance, so there is no
  # upgrade on our side. Revisit when both move to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.x via zbus 5 (ashpd, tauri-plugin-single-instance); no safe upgrade yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.x via zbus 5; same exit as RUSTSEC-2026-0370" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.x via zbus 5; same exit as RUSTSEC-2026-0370" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  # webpki-root-certs (the Mozilla CA bundle that ureq verifies the ECB feed against): permissive data license.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

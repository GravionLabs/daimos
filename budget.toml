# Performance thresholds checked in CI (`scripts/ci/check-budget.py`). They are the numbers of the
# "Performance budget" table in docs/specs/product-spec.md; raise one only with an ADR.
#
# A benchmark fails the pull request when its p95 per-iteration time exceeds `p95_ms` by more than
# `tolerance` (the noise margin of shared CI runners).

tolerance = 0.20

# Keystroke to ranked results for 2000 apps (the matcher and the ranker).
[[benchmark]]
match = "rank_2000_apps/*"
p95_ms = 16

# Loading the stored application list at start (the index is read before the hotkey is registered).
[[benchmark]]
match = "index_load_2000/*"
p95_ms = 20

# Loading the stored launches at start.
[[benchmark]]
match = "frecency_load_10k/*"
p95_ms = 50

# One query round trip to a warm long-running Python script (crates/daimos-ext/benches/script_warm.rs).
[[benchmark]]
match = "script_warm_round_trip/*"
p95_ms = 30

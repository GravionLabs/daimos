name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes the running checks obsolete. A push to main is not cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Packages Tauri needs on Linux (see README.md).
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libgtk-layer-shell-dev
    librsvg2-dev libssl-dev pkg-config build-essential

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu (X11), os: ubuntu-latest, session: x11 }
          - { name: Ubuntu (Wayland, sway), os: ubuntu-latest, session: wayland }
          - { name: Windows, os: windows-latest, session: native }
          - { name: macOS, os: macos-latest, session: native }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES xvfb
      - name: Install sway and the portals
        if: matrix.session == 'wayland'
        run: sudo apt-get install -y sway xdg-desktop-portal xdg-desktop-portal-wlr dbus-daemon
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.session }}
      - run: pnpm install --frozen-lockfile
      # The Rust crates embed apps/ui/dist, so the UI is built first.
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (X11)
        if: matrix.session == 'x11'
        run: xvfb-run --auto-servernum cargo test --workspace
      - name: Rust tests (headless sway)
        if: matrix.session == 'wayland'
        run: scripts/ci/run-in-sway.sh cargo test --workspace
      - name: Rust tests
        if: matrix.session == 'native'
        run: cargo test --workspace
      - run: pnpm lint
      - run: pnpm test
      # `pnpm test` also checks that apps/ui/src/bindings.ts is current (bindings:check).
      # rpm bundling hangs on the runner and AppImage needs extra tools: the debug bundle on Linux is
      # the deb; the full set of packages is the v1.0 packaging work.
      - name: Debug bundle
        if: matrix.session != 'wayland'
        run: pnpm tauri build --debug ${{ runner.os == 'Linux' && '--bundles deb' || '' }}
      - name: Upload the debug bundle
        if: matrix.session != 'wayland'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daimos-debug-${{ matrix.os }}
          path: target/debug/bundle/**
          if-no-files-found: error

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

name: Issue conventions

# Fixes the "[Level] " title prefix and flags PBIs and tasks that miss required sections
# (AGENTS.md, "Issue conventions"). Changes made with GITHUB_TOKEN do not trigger workflows again.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-conventions-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const conventions = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-conventions.mjs`);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            // Re-read the issue: the payload may be older than an edit made in the meantime.
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });

            const level = conventions.levelOf(issue.labels);
            if (!level) {
              core.info('No level label; nothing to check.');
              return;
            }

            const title = conventions.expectedTitle(issue.title, level);
            if (title !== issue.title) {
              await github.rest.issues.update({ owner, repo, issue_number, title });
              core.info(`Title: "${issue.title}" -> "${title}"`);
            }

            if (!conventions.REQUIRED_SECTIONS[level]) return;
            const missing = conventions.missingSections(issue.body, level);
            const labeled = issue.labels.some((l) => (l.name ?? l) === conventions.NEEDS_REFINEMENT);

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(conventions.MARKER));
            const body = conventions.commentBody(level, missing);

            if (missing.length > 0) {
              await github.rest.issues.createLabel({
                owner, repo, name: conventions.NEEDS_REFINEMENT, color: 'FBCA04',
                description: 'Misses sections required by the issue conventions in AGENTS.md',
              }).catch((error) => { if (error.status !== 422) throw error; });
              if (!labeled) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [conventions.NEEDS_REFINEMENT] });
              if (!previous) await github.rest.issues.createComment({ owner, repo, issue_number, body });
              else if (previous.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              core.warning(`Missing sections: ${missing.join(', ')}`);
            } else {
              if (labeled) await github.rest.issues.removeLabel({ owner, repo, issue_number, name: conventions.NEEDS_REFINEMENT });
              if (previous && previous.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            }

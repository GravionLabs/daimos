[package]
name = "daimos-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
daimos-core = { version = "0.1.0", path = "../daimos-core" }
dirs = "7.0.0"
futures = "0.3.34"
log = "0.4.34"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["process", "io-util", "fs", "time", "macros", "rt"] }
tokio-util = "0.7.20"
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

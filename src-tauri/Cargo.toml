[package]
name = "daimos-app"
description = "Cross-platform command palette"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "daimos-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the NSPanel conversion (tauri-nspanel) needs it; tauri-build wants the feature and
# `macOSPrivateApi` in tauri.conf.json to agree, on every platform.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
daimos-core = { path = "../crates/daimos-core" }
daimos-ext = { path = "../crates/daimos-ext" }
daimos-platform = { path = "../crates/daimos-platform", default-features = false }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.3"

[features]
default = ["layer-shell"]
# Overlay window on Wayland compositors with wlr-layer-shell; needs libgtk-layer-shell-dev.
layer-shell = ["daimos-platform/layer-shell"]
# Serve the built UI from the binary instead of the dev server: what a release build and the
# measurements in CI (scripts/ci/measure-app.py) use.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[lib]
name = "daimos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

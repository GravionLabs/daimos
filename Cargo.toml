[workspace]
resolver = "3"
members = ["crates/daimos-core", "crates/daimos-platform", "crates/daimos-ext", "crates/daimos-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/GravionLabs/daimos"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

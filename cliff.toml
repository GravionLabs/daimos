# Release notes from the Conventional Commits of the pull requests (git-cliff, via GravionLabs/ci's gh-release).
[changelog]
header = """# Changelog

All notable changes to GravionLabs/daimos are documented here.
Versioning follows [Semantic Versioning](https://semver.org/) and GitVersion (GitVersion).

---

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### ⚠️ Breaking changes
{% for commit in breaking %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif -%}
{{ commit.message | upper_first }}
{% endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}⚠️ **Breaking**: {% endif -%}
{% if commit.scope %}**{{ commit.scope }}**: {% endif -%}
{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
# A squash merge lists the commits of the pull request as "* type: message" lines in its body.
# Strip the bullet so each one is read as its own conventional commit.
commit_preprocessors = [
  { pattern = '(?m)^\* ', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^design", group = "Design" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security", group = "Security" },
  { message = "^chore|^ci|^style|^test|^build", skip = true },
]
# A `!` after the type (`feat!: ...`) is a breaking change: it is listed first under "Breaking changes", and also under its type, and a `chore!` is not skipped.
protect_breaking_commits = true
filter_commits = true
# Pre-releases are releases here (0.1.0-beta.126): the notes of a release are what came after the last tag of any kind.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
topo_order = false
sort_commits = "oldest"
